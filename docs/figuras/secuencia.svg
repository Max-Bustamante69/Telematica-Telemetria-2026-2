    <text x="265" y="254" text-anchor="middle">UDP: TELEMETRY|NODE03|41|TEMP|42.1</text>
    <rect x="436" y="266" width="150" height="20" rx="3" fill="#fdf0f0" stroke="#b33"/><text x="511" y="280" text-anchor="middle">42.1 &gt; 40 → alerta</text>
    <line x1="430" y1="300" x2="760" y2="300" stroke="#b33" stroke-width="2" marker-end="url(#a)"/>
