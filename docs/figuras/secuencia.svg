<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
  </defs>
  <rect width="860" height="470" fill="#fff"/>
  <g font-weight="bold" text-anchor="middle">
    <rect x="40" y="20" width="120" height="30" rx="4" fill="#eef4ff" stroke="#4a6fb5"/><text x="100" y="40">Nodo NODE03</text>
    <rect x="370" y="20" width="120" height="30" rx="4" fill="#f3fbf3" stroke="#3a8f3a"/><text x="430" y="40">Servidor</text>
    <rect x="700" y="20" width="120" height="30" rx="4" fill="#fff4e6" stroke="#c77d2a"/><text x="760" y="40">Operador</text>
  </g>
