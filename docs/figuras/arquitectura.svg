<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#fff"/>

  <!-- Nodos -->
  <rect x="30" y="40" width="200" height="200" rx="8" fill="#eef4ff" stroke="#4a6fb5"/>
  <text x="130" y="62" text-anchor="middle" font-weight="bold">Nodos de telemetría (Python)</text>
  <g>
    <rect x="50" y="78" width="160" height="26" rx="4" fill="#fff" stroke="#4a6fb5"/><text x="130" y="95" text-anchor="middle">NODE01 · Planta Norte</text>
    <rect x="50" y="110" width="160" height="26" rx="4" fill="#fff" stroke="#4a6fb5"/><text x="130" y="127" text-anchor="middle">NODE02 · Bodega Sur</text>
    <rect x="50" y="142" width="160" height="26" rx="4" fill="#fff" stroke="#4a6fb5"/><text x="130" y="159" text-anchor="middle">NODE03 · Subestación</text>
    <rect x="50" y="174" width="160" height="26" rx="4" fill="#fff" stroke="#4a6fb5"/><text x="130" y="191" text-anchor="middle">NODE04, NODE05 …</text>
  </g>
  <text x="130" y="225" text-anchor="middle" font-size="11" fill="#555">TEMP · HUM · ENERGY · VIB · STATUS</text>

  <!-- Operadores -->
  <rect x="30" y="300" width="200" height="120" rx="8" fill="#fff4e6" stroke="#c77d2a"/>
  <text x="130" y="322" text-anchor="middle" font-weight="bold">Clientes operador (Python)</text>
  <rect x="50" y="338" width="160" height="26" rx="4" fill="#fff" stroke="#c77d2a"/><text x="130" y="355" text-anchor="middle">Operador 1 (CLI)</text>
  <rect x="50" y="370" width="160" height="26" rx="4" fill="#fff" stroke="#c77d2a"/><text x="130" y="387" text-anchor="middle">Operador 2 (CLI)</text>

  <!-- Navegador -->
  <rect x="30" y="440" width="200" height="50" rx="8" fill="#f2f2f2" stroke="#777"/>
  <text x="130" y="470" text-anchor="middle" font-weight="bold">Navegador web</text>

  <!-- DNS -->
  <rect x="330" y="30" width="170" height="60" rx="8" fill="#f9f9f9" stroke="#777" stroke-dasharray="4 3"/>
  <text x="415" y="52" text-anchor="middle" font-weight="bold">DNS (Cloudflare)</text>
  <text x="415" y="72" text-anchor="middle" font-size="11">telemetria.digitdeck.co → A</text>

  <!-- Internet -->
  <ellipse cx="415" cy="290" rx="70" ry="40" fill="#f7f7f7" stroke="#999"/>
  <text x="415" y="295" text-anchor="middle" fill="#555">Internet</text>

  <!-- EC2 / Docker / Servidor -->
  <rect x="560" y="120" width="320" height="360" rx="10" fill="#f3fbf3" stroke="#3a8f3a"/>
  <text x="720" y="142" text-anchor="middle" font-weight="bold">AWS EC2 (Ubuntu 24.04) · grupo de seguridad</text>
  <text x="720" y="158" text-anchor="middle" font-size="11" fill="#555">22/tcp · 5000/udp · 5001/tcp · 8080/tcp</text>
  <rect x="580" y="170" width="280" height="290" rx="8" fill="#fff" stroke="#2c6fbb"/>
  <text x="720" y="190" text-anchor="middle" font-weight="bold">Contenedor Docker · telemetry-server (C)</text>
  <g font-size="12">
    <rect x="600" y="205" width="240" height="30" rx="4" fill="#eef4ff" stroke="#4a6fb5"/><text x="720" y="224" text-anchor="middle">hilo UDP 5000 · recvfrom / sendto</text>
    <rect x="600" y="243" width="240" height="30" rx="4" fill="#fff4e6" stroke="#c77d2a"/><text x="720" y="262" text-anchor="middle">hilo TCP 5001 · accept → hilo por cliente</text>
    <rect x="600" y="281" width="240" height="30" rx="4" fill="#f2f2f2" stroke="#777"/><text x="720" y="300" text-anchor="middle">hilo HTTP 8080 · / y /api/status</text>
    <rect x="600" y="319" width="240" height="30" rx="4" fill="#fdf0f0" stroke="#b33"/><text x="720" y="338" text-anchor="middle">hilo watchdog · nodos inactivos (15 s)</text>
    <rect x="600" y="365" width="240" height="80" rx="4" fill="#fafafa" stroke="#555"/>
    <text x="720" y="385" text-anchor="middle" font-weight="bold">Estado compartido (mutex)</text>
    <text x="720" y="403" text-anchor="middle">nodos · últimas mediciones · alertas</text>
    <text x="720" y="421" text-anchor="middle">contadores UDP/TCP · suscriptores</text>
    <text x="720" y="439" text-anchor="middle">umbrales → ALERT|…</text>
  </g>

  <!-- Flechas -->
  <line x1="230" y1="140" x2="345" y2="290" stroke="#4a6fb5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="200" fill="#4a6fb5" font-size="12">UDP 5000 TELEMETRY</text>
  <text x="250" y="215" fill="#4a6fb5" font-size="12">TCP 5001 REGISTER / BYE</text>

  <line x1="230" y1="360" x2="345" y2="300" stroke="#c77d2a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="345" fill="#c77d2a" font-size="12">TCP 5001 consultas ↔ respuestas, ALERT</text>

  <line x1="230" y1="465" x2="360" y2="320" stroke="#777" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245" y="440" fill="#555" font-size="12">HTTP 8080</text>

  <line x1="485" y1="290" x2="560" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="130" y1="40" x2="330" y2="55" stroke="#999" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="200" y="35" fill="#666" font-size="11">getaddrinfo()</text>
  <line x1="130" y1="300" x2="330" y2="80" stroke="#999" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
